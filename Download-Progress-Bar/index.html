<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Bar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            width: 300px;
            height: 200px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(to right, rgb(81, 80, 80), rgba(0, 0, 0, 0.712));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #progress-bar {
            background-color: white;
            border-radius: 20px;
            height: 5%;
            width: 50%;
            margin: 15px 0;
        }

        #bar-color {
            width: 0%;
            background-color: rgb(104, 172, 2);
            height: 100%;
            border-radius: inherit;
        }

        h3,
        p {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            color: white;
            font-weight: 700;
            text-align: center;
        }

        @media only screen and (min-width:320px) and (max-width:420px) {
            h3 {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div id="container">
        <h3>Downloading...</h3>
        <div id="progress-bar">
            <div id="bar-color"></div>
        </div>
        <p>0%</p>
    </div>
</body>
<script src="script.js"></script>

</html>
