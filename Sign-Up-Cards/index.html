<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Cards v1.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="cropped_circle_image (1).png" type="image/x-icon">
    <meta http-equiv="ScreenOrientation" content="autoRotate:disabled">
</head>

<body>
    <div class="signup">
        <div class="box">
            <div class="logo">
                <img src="./images/gpay logo.png" alt="gpay logo">
            </div>
            <div class="title">Sign In to Google Pay</div>
            <form action="post">
                <input type="text" placeholder="Email or Phone" required name="email/phone">
                <BR></BR>
                <input type="password" placeholder="Password" required name="password">
                <BR></BR>
                <a href="https://pay.google.com" target="_blank" class="button"><span>Login</span></a>
            </form>
            <div class="frgtpw"><a href="https://www.support.google.com" target="_blank">Forgot Password?</a></div>
            <div class="signup">Don't have an account? <br> <span><a href="https://pay.google.com"
                        target="_blank">Create Account</a></span></div>
        </div>
        <!-- Pinterest -->
        <div class="box">
            <div class="logo">
                <img src="https://static.vecteezy.com/system/resources/previews/018/930/568/non_2x/pinterest-logo-pinterest-transparent-free-png.png"
                    alt="Pinterest logo">
            </div>
            <div class="title">Sign In to Pinterest</div>
            <form action="post">
                <input type="text" placeholder="Email or Phone" required name="email/phone">
                <BR></BR>
                <input type="password" placeholder="Password" required name="password">
                <BR></BR>
                <a href="https://www.pinterest.com" target="_blank" class="button"><span>Login</span></a>
            </form>
            <div class="frgtpw"><a href="https://help.pinterest.com/en/article/reset-your-password"
                    target="_blank">Forgot Password?</a></div>
            <div class="signup">Don't have an account? <br> <span><a href="https://in.pinterest.com/business/create/"
                        target="_blank">Create Account</a></span></div>
        </div>

    </div>
</body>

</html>
