<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCard v0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #222;
            color: gainsboro;
            font-family: Georgia, 'Times New Roman', Times, serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        form input {
            display: block;
        }

        .link,
        .name,
        .profession,
        .bio,
        .submit-btn {
            margin-top: 4px;
            margin-bottom: 10px;
        }

        .card {
            max-width: 300px;
            color: #ffff;
            border: 1px solid #555;
            padding: 20px;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
        }

        .pfp {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .pfp img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h5 {
            margin-top: 3px;
        }

        .card p {
            font-size: 12px;
            margin-top: 20px;
        }

        #main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <label for="name">Enter Browser based URL for Profile Picture:</label>
            <input type="text" name="profile-pic" id="pfp" placeholder="Profile pic URL" class="link">
            <label for="name">Enter Name:</label>
            <input type="text" name="name" id="name" placeholder="Name" class="name">
            <label for="occupation">Enter Profession:</label>
            <input type="text" name="occupation" id="occupation" placeholder="Occupation" class="profession">
            <label for="Bio">Your Bio:</label>
            <input type="text" name="bio" id="Bio" placeholder="Bio" class="bio">
            <input type="submit" class="submit-btn">
        </form>
    </div>
</body>
<script src="script.js"></script>

</html>
